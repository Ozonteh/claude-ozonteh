seoTitle: "Despre Ozonteh, distribuitor oficial BULL Machines | BULL Moldova"
seoDescription: "Ozonteh Impex SRL, Strășeni: din 2011 în tehnică agricolă, azi distribuitor oficial BULL Machines în Moldova, cu service și piese. Sună: 069 898 307."
h1: "Ozonteh și BULL Machines"
lead: "Ozonteh Impex SRL este distribuitorul oficial BULL Machines în Republica Moldova. Aducem utilajele direct de la producător și le deservim la Strășeni și la Bălți."
blocks:
  ozonteh:
    title: "Cine este Ozonteh"
    text: |
      Ozonteh Impex SRL a pornit în 2011, la Strășeni. Au fondat-o trei tineri pasionați de tehnică agricolă, care au început cu importul de tractoare japoneze. Azi Ozonteh oferă soluții complete pentru vii, livezi și ferme mici și mijlocii: alegi utilajul, ți-l livrăm, iar service-ul și piesele le ai tot la noi.

      Suntem dealer oficial pentru peste 10 branduri, printre care LS, Ferrari, Zanon, Bao Mak, Adrimak și Kadioglu. Ca distribuitor oficial BULL Machines, aducem în Moldova și utilaje de construcții: buldoexcavatoare, încărcătoare frontale și skid steer.

      Avem service propriu, cu mecanici calificați, la sediul central din Strășeni, Șos. Chișinău 69 (E58), și la filiala din Bălți, Str. Dragomir 4. Facem deservire în garanție și post-garanție, iar filtrele, consumabilele și piesele de uzură le ținem în stoc în Moldova. În România avem reprezentanța Deltateh, la București și Cluj.

      Livrăm utilajele în toată Moldova, la sediul clientului sau direct pe șantier. Pentru leasing lucrăm cu maib și Microinvest.
  bull:
    title: "Cine este BULL Machines"
    text: |
      BULL Machines Pvt Ltd are sediul în Coimbatore, India, și face parte din grupul AV. Fondatorul și directorul general al companiei este V. Parthiban.

      Potrivit BULL Machines, peste 60.000 de utilaje BULL lucrează azi în lume. Compania are peste 600 de dealeri, peste 150 de ingineri de service rezidenți, peste 24 de ani de experiență la atașamente pentru tractoare și două fabrici. BULL declară că uzina sa de utilaje de construcții produce 12.000 de utilaje pe an și că departamentul propriu de cercetare-dezvoltare, recunoscut de Ministerul Științei și Tehnologiei din India, are brevete.

      Potrivit producătorului, cabinele BULL sunt certificate ROPS/FOPS și protejează operatorul la răsturnare și la căderea obiectelor. Componentele vin de la furnizori cunoscuți: motoare Kirloskar, Perkins, Kubota și Ashok Leyland, transmisii Carraro și ZF. Ce motor și ce transmisie are fiecare model vezi în fișa lui tehnică.
  partnership:
    title: "Ce primești tu din acest parteneriat"
    text: |
      Cumperi un utilaj nou, adus direct de la BULL Machines, cu documente și garanție de producător: 24 de luni sau 2000 de moto-ore pentru utilaj, 3 ani sau 3000 de moto-ore pentru motor. Când ai nevoie de o piesă sau de un mecanic, nu depinzi de un intermediar din altă țară.

      Garanția și service-ul le face Ozonteh, la Strășeni și la Bălți. Filtrele, consumabilele și piesele de uzură sunt în stoc în Moldova. Utilajul ți-l aducem la sediu sau direct pe șantier, oriunde în Moldova. Înainte să cumperi, îl poți vedea la lucru, la o demonstrație la Strășeni. Pentru finanțare lucrăm cu maib și Microinvest, iar prețul îl primești în ofertă, pentru configurația ta.
  visit:
    title: "Delegația BULL Machines la Strășeni"
    text: |
      Pe 11 septembrie 2026, o delegație BULL Machines a vizitat sediul Ozonteh din Strășeni, Șos. Chișinău 69 (E58). La această adresă sunt sediul central Ozonteh și service-ul în care se deservesc utilajele BULL. Clipul de la vizită îl găsești pe canalul YouTube Ozonteh. Dacă vrei să vezi și tu utilajele BULL de aproape, programează o demonstrație la Strășeni: 069 898 307.
