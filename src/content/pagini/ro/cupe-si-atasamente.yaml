seoTitle: "Cupe și atașamente pentru buldoexcavator BULL | BULL Moldova"
seoDescription: "19 cupe și atașamente BULL: cupă 6 în 1, Square Cut, booster, ciocan hidraulic, furci, lamă. Pentru buldoexcavator, încărcător și skid steer. Sună: 069 898 307."
h1: "Cupe și atașamente BULL"
lead: "19 cupe și atașamente pentru buldoexcavatoare, încărcătoare frontale și skid steer. Schimbi atașamentul și același utilaj face altă lucrare."
blocks:
  intro:
    title: "De ce contează atașamentul"
    text: |
      Utilajul dă forța, atașamentul decide ce faci cu ea. Cu cupa standard încarci pământ și nisip. Cu cupa 6 în 1 încarci, nivelezi, apuci, împingi, sapi și descarci, fără să schimbi nimic. Cupa Square Cut lasă pereți drepți la 90° în gropile de fundație, deci nu mai finisezi cu lopata. Ciocanul hidraulic sparge beton și asfalt, furca stivuitor mută paleți, iar lama nivelează și curăță zăpada. Un atașament ales bine înseamnă mai puține treceri și mai puțin lucru manual.

      Compatibilitatea depinde de tipul utilajului. Buldoexcavatorul are două brațe: în față poartă cupele de încărcare, furcile, gheara pentru baloți, lama și cupa cu tăvălug, iar în spate cupele de excavator, cupa trapezoidală, cupa pentru curățarea șanțurilor, Square Cut, ciocanul hidraulic și dintele ripper. Încărcătorul frontal HD76 folosește atașamentele de față, inclusiv încărcătorul de trestie. Pe skid steer se montează furca stivuitor și ciocanul hidraulic.

      Filtrează lista după tipul utilajului ca să vezi doar atașamentele care ți se potrivesc. Compatibilitatea exactă cu modelul tău o verificăm la comandă.
faq:
  - q: "Cum aflu dacă un atașament merge pe utilajul meu?"
    a: "La fiecare atașament din listă vezi pe ce tip de utilaj se montează: buldoexcavator, încărcător frontal sau skid steer. Compatibilitatea exactă depinde de model și de configurație, așa că o verificăm la comandă. Sună la 069 898 307 și spune-ne modelul utilajului."
  - q: "Ce face cupa 6 în 1?"
    a: "E o cupă cu falcă: cu ea încarci, nivelezi, apuci, împingi, sapi și descarci, deci ține locul mai multor cupe separate. Se montează pe buldoexcavatoare și pe încărcătorul frontal. HD 100 în versiunea Carraro + Casappa vine cu cupa 6 în 1."
  - q: "Ce cupă aleg pentru gropi de fundație?"
    a: "Cupa pătrată Square Cut. Taie pereți drepți la 90° în gropile de fundație, în bazine și în fosele septice, deci nu mai pierzi timp cu finisarea manuală. Se montează pe brațul de săpare al buldoexcavatorului. Pentru canale de irigație și de drenaj, cupa trapezoidală face profilul dintr-o singură trecere."
