seoTitle: "Buldoexcavatoare BULL de vânzare în Moldova: 6 modele | BULL Moldova"
seoDescription: "Buldoexcavatoare BULL de 74,5–100 CP, 2WD și 4WD, cu garanție de 24 de luni sau 2000 de moto-ore. Service la Strășeni și Bălți. Cere ofertă: 069 898 307."
h1: "Buldoexcavatoare BULL"
lead: "Șase modele de buldoexcavator, de la 74,5 la 100 CP, cu tracțiune 2WD sau 4WD. Fiecare are garanție de 24 de luni sau 2000 de moto-ore, iar motorul are 3 ani sau 3000 de moto-ore."
blocks:
  intro:
    title: "Ce buldoexcavator ți se potrivește"
    text: |
      Buldoexcavatorul face două meserii. Cu brațul din spate sapi șanțuri pentru apă, canalizare și cabluri, gropi de fundație, fose septice și canale de drenaj. Cu cupa din față încarci basculanta, astupi șanțul, nivelezi terenul și cureți zăpada. Între obiecte se deplasează singur, cu până la 40 km/h. Îl cumpără firmele de construcții și de rețele, constructorii de drumuri, primăriile și fermele care au mult de săpat.

      Gama BULL are două clase. În clasa de 75 CP sunt SD76 Super Smart (75 CP, 130 l/min, până la 40 km/h), CH76 Challenger (76 CP, 2WD, cost redus pe oră de lucru) și Grandia DLX (74,5 CP, 4WD, cabină cu aer condiționat și joystick). Îți ajung pentru rețele, fundații de case și lucrări comunale. Clasa de 96–100 CP îți dă forță pentru lucru greu, zi de zi: HD96 4WD (96 CP, 240 bar, cupă de 0,30 m³), HD 100 (100 CP Perkins, în versiunea ZF Power Shift sau Carraro + Casappa) și Grandia (100 CP, 9.700 kg).

      Tracțiunea 2WD îți ajunge pe teren ferm și pe drum. Pe noroi, pe pământ proaspăt umplut sau în pantă, ia 4WD: trag ambele punți, iar roțile patinează mai puțin când împingi cupa în grămadă. Grandia are în plus direcție pe toate cele 4 roți, cu trei moduri: circular, crab și 2 roți directoare. Întorci mai strâns și te muți pe diagonală, paralel cu șanțul.
faq:
  - q: "Ce putere îmi trebuie: 75 sau 100 CP?"
    a: "Clasa de 75 CP îți ajunge pentru rețele, fundații și amenajări: SD76 Super Smart, CH76 Challenger și Grandia DLX. Dacă utilajul lucrează zilnic în pământ greu, încarcă multe basculante sau stă pe șantiere mari de drumuri, alege clasa de 96–100 CP: HD96 4WD, HD 100 sau Grandia. Spune-ne lucrarea la 069 898 307 și îți recomandăm modelul."
  - q: "2WD sau 4WD: ce aleg?"
    a: "2WD e varianta mai simplă și îți ajunge pe teren ferm, pe asfalt și pe pietriș. 4WD trage pe ambele punți și contează în noroi, în arătură, pe pământ proaspăt umplut și în pantă. SD76 Super Smart și HD96 sunt disponibile în ambele variante, CH76 Challenger doar 2WD, iar Grandia DLX, Grandia și HD 100 doar 4WD."
  - q: "Cât de adânc sapă un buldoexcavator BULL?"
    a: "SD76 Super Smart, Grandia, HD96 4WD și HD 100 sapă până la 4,6 m cu brațul standard și până la 5,6 m cu braț extensibil. CH76 Challenger sapă până la 4,77 m. Cupele de excavator au între 0,10 și 0,31 m³, în funcție de model și de lucrare."
  - q: "Cât costă un buldoexcavator BULL și se poate lua în leasing?"
    a: "Prețul îl primești în ofertă, calculat pentru modelul și configurația ta: braț standard sau extensibil, cupe și atașamente. Leasingul îl faci prin maib sau Microinvest. Sună la 069 898 307 sau lasă numărul în formular și te sunăm noi."
