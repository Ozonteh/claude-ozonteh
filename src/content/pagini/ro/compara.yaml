seoTitle: "Compară utilajele BULL: putere, greutate, săpare | BULL Moldova"
seoDescription: "Compară până la 3 utilaje BULL, rând cu rând: putere, motor, greutate, adâncime de săpare, debit hidraulic și tracțiune. Apoi cere ofertă: 069 898 307."
h1: "Compară modelele BULL"
lead: "Pune alături până la trei utilaje BULL și vezi diferențele de putere, greutate, hidraulică și tracțiune înainte să ceri oferta."
blocks:
  howto:
    title: "Cum folosești comparatorul"
    text: |
      Alege până la trei modele din listele de mai jos sau bifează „Compară” pe cartonașele din catalog. Tabelul pune specificațiile alături, rând cu rând: putere, motor, greutate, adâncime de săpare, viteză, debit și presiune hidraulică. Pe telefon glisezi între modele. Liniuța „—” înseamnă că BULL nu publică valoarea; dacă ai nevoie de ea, întreabă-ne.
