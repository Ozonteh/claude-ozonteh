seoTitle: "Miniîncărcătoare skid steer BULL AV490 și AV740 | BULL Moldova"
seoDescription: "Skid steer BULL în Moldova: AV490 de 3 t și 52 CP, AV740 de 4,3 t și 74,3 CP, cu motoare Kubota. Pentru spații înguste, ferme și depozite. Sună: 069 898 307."
h1: "Miniîncărcătoare skid steer BULL"
lead: "Două modele compacte, cu motoare Kubota și tracțiune 4WD: AV490 de 3 t și AV740 de 4,3 t. Pentru lucrările unde un utilaj mare nu încape."
blocks:
  intro:
    title: "Unde lucrează un skid steer"
    text: |
      Skid steer-ul e utilajul pentru locurile în care un buldoexcavator nu încape sau nu are loc să manevreze: curți, hale, grajduri, depozite, șantiere de case. În ferme încarcă gunoiul de grajd și furajele și curăță adăposturile. În depozite mută paleți cu furca stivuitor. În serviciile comunale curăță străzi și platforme și transportă pământ și pietriș pentru amenajări.

      AV490 e modelul compact: 3.000 kg, motor Kubota turbo de 52 CP (39 kW), 655 kg sarcină nominală și 1.500 mm lățime peste anvelope. Întoarce pe loc, se conduce din joystick și are ecran tactil și cameră de mers înapoi. Debitul hidraulic standard e de 57 l/min, opțional 82 l/min pentru freze și perii.

      AV740 e mai mare și mai puternic: 4.272 kg, motor Kubota turbo de 74,3 CP (55,4 kW) și 1.347 kg sarcină nominală. Brațul cu ridicare verticală păstrează sarcina constantă pe toată înălțimea și descarcă la 2.570 mm, direct în camion. Hidraulica dă 102 l/min, opțional 131 l/min. Cabina ROPS/FOPS și autonivelarea sunt standard.
faq:
  - q: "AV490 sau AV740: pe care îl aleg?"
    a: "AV490, dacă lucrezi în spații înguste și ridici sarcini ușoare: 3.000 kg, 1.500 mm lățime peste anvelope și 655 kg sarcină nominală. AV740, dacă încarci camioane și muți paleți grei: 1.347 kg sarcină nominală, descărcare la 2.570 mm și hidraulică de 102 l/min. Spune-ne lucrarea la 069 898 307 și îți recomandăm modelul."
  - q: "Ce înseamnă ridicare verticală la AV740?"
    a: "Brațul urcă pe o traiectorie verticală, nu pe un arc. Sarcina rămâne aproape de utilaj pe toată înălțimea, așa că AV740 ridică aceeași greutate jos și sus și ajunge mai ușor deasupra oblonului de camion. Înălțimea de descărcare e de 2.570 mm."
  - q: "Ce atașamente merg pe skid steer-ul BULL?"
    a: "Pe lângă cupă, din gama de atașamente BULL se montează pe skid steer furca stivuitor și ciocanul hidraulic. AV490 are prindere rapidă a atașamentelor, iar cu debitul hidraulic mare, de 82 l/min, lucrează și cu freze și perii. Compatibilitatea exactă cu modelul tău o verificăm la comandă."
