seoTitle: "Contacte Ozonteh: Strășeni, Bălți, 069 898 307 | BULL Moldova"
seoDescription: "BULL Moldova: Strășeni, Șos. Chișinău 69 (E58), și filiala din Bălți, Str. Dragomir 4. Luni–vineri 08:00–18:00, sâmbătă 08:00–14:00. Sună: 069 898 307."
h1: "Contacte BULL Moldova"
lead: "Linia BULL Moldova: 069 898 307, pentru apeluri și WhatsApp. Ne găsești la Strășeni, Șos. Chișinău 69 (E58), și la Bălți, Str. Dragomir 4."
blocks:
  visit:
    title: "Vizită sau demonstrație la Strășeni"
    text: |
      Vrei să vezi un utilaj BULL la lucru înainte să-l cumperi? Sună la 069 898 307, scrie-ne pe WhatsApp sau bifează „Vreau demonstrație” în formular. Spune-ne ce model te interesează și ce lucrare ai, iar noi stabilim ziua și ora. Programul: luni–vineri 08:00–18:00, sâmbătă 08:00–14:00, duminică liber.
  romania:
    title: "Reprezentanța din România"
    text: |
      În România, Ozonteh are reprezentanța Deltateh, cu adrese la București și în județul Cluj. Adresele și telefoanele le găsești în lista de filiale. Pentru utilajele BULL din acest site, linia directă rămâne +373 69 898 307, pentru apeluri și WhatsApp.
