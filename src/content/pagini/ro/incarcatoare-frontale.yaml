seoTitle: "Încărcător frontal BULL Loader HD76 în Moldova | BULL Moldova"
seoDescription: "Încărcător frontal BULL HD76: 76 CP, 2.400 kg sarcină utilă și trei cupe de 1,1–1,4 m³, pentru cariere, concasoare și depozite. Cere ofertă: 069 898 307."
h1: "Încărcătoare frontale BULL"
lead: "BULL Loader HD76: 76 CP, 2.400 kg sarcină utilă și trei cupe, de la 1,1 la 1,4 m³. Pentru încărcare continuă în cariere, la concasoare și în depozite de agregate."
blocks:
  intro:
    title: "Un utilaj făcut pentru încărcare"
    text: |
      Încărcătorul frontal nu sapă șanțuri. Face un singur lucru: ia material din grămadă și îl duce în basculantă, în buncăr sau în concasor. Pentru asta, BULL Loader HD76 are motor Kirloskar de 76 CP (56,7 kW), transmisie Carraro, hidraulică de 113 l/min la 230 bar și 2.400 kg sarcină utilă. Forța de rupere la cupă e de 8.183 kgf, așa că cupa intră ușor în grămada de piatră sau de nisip compactat.

      HD76 vine cu trei cupe, alese după material și după înălțimea la care descarci. Crusher King, de 1,4 m³, descarcă la 3,77 m, direct în gura concasorului. Heavy Duty, de 1,26 m³, descarcă la 2,96 m și e cupa pentru material greu. Booster, de 1,1 m³, ridică punctul de descărcare la 4,00 m, pentru basculante cu oblon înalt și pentru buncăre.

      Între carieră, depozit și șantier, HD76 se mută singur, cu până la 41 km/h. Îl iei 2WD pentru platforme betonate sau 4WD pentru carieră și teren moale. Greutatea operațională e de 7.850 kg.
faq:
  - q: "Ce cupă aleg pentru HD76?"
    a: "Depinde unde descarci. Dacă alimentezi un concasor, ia Crusher King: 1,4 m³ și descărcare la 3,77 m. Pentru material greu, Heavy Duty: 1,26 m³ și descărcare la 2,96 m. Pentru basculante înalte și buncăre, Booster: 1,1 m³ și descărcare la 4,00 m. Spune-ne ce încarci și unde, și îți recomandăm cupa."
  - q: "De ce încărcător frontal și nu buldoexcavator?"
    a: "Dacă lucrarea e doar de încărcat, brațul de săpare nu-ți folosește. HD76 are cupe de până la 1,4 m³ și 2.400 kg sarcină utilă, iar buldoexcavatorul CH76 Challenger, de exemplu, are cupă de 1,26 m³ și 2.200 kg. Dacă pe lângă încărcare ai și șanțuri sau gropi, alege un buldoexcavator."
  - q: "Ce garanție are HD76 și unde se face service-ul?"
    a: "HD76 are garanție de 24 de luni sau 2000 de moto-ore, iar motorul Kirloskar de 3 ani sau 3000 de moto-ore. Service-ul îl fac mecanicii Ozonteh la Strășeni și la Bălți, în garanție și post-garanție. Filtrele și piesele de uzură sunt în stoc în Moldova: 069 898 822."
