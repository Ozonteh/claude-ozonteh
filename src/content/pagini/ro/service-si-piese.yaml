seoTitle: "Service și piese de schimb BULL în Moldova | BULL Moldova"
seoDescription: "Service BULL în garanție și post-garanție, la Strășeni și Bălți. Filtre, consumabile și piese de uzură în Moldova. Piese: 069 898 822. Service: 069 898 842."
h1: "Service și piese de schimb BULL"
lead: "Service propriu Ozonteh, cu mecanici calificați, la Strășeni și la Bălți. Filtrele, consumabilele și piesele de uzură sunt în stoc în Moldova."
blocks:
  services:
    title: "Ce facem pentru utilajul tău"
    items:
      - title: "Deservire în garanție"
        text: "Utilajul BULL are garanție de 24 de luni sau 2000 de moto-ore, iar motorul are 3 ani sau 3000 de moto-ore. Lucrările în garanție le fac mecanicii Ozonteh, în service-ul propriu de la Strășeni și de la Bălți."
      - title: "Service post-garanție"
        text: "Când expiră garanția, rămâi la același service și la aceiași mecanici. Ei caută cauza defecțiunii și repară motorul, transmisia și sistemul hidraulic, cu piese potrivite pentru modelul tău. Nu cauți alt atelier."
      - title: "Piese de schimb"
        text: "Filtrele, consumabilele și piesele de uzură sunt în stoc în Moldova. Piesele care lipsesc din stoc le comandăm pentru tine. Sună la 069 898 822 și spune modelul și seria utilajului."
      - title: "Revizii periodice"
        text: "Schimbul de ulei și de filtre, verificarea hidraulicii, a transmisiei și a punților, la intervalele recomandate de BULL. O revizie făcută la timp te ferește de opriri neplanificate pe șantier. Programare: 069 898 842."
  parts:
    title: "Comandă piese la 069 898 822"
    text: |
      Când suni la 069 898 822, ține la îndemână modelul utilajului și seria de pe plăcuța de identificare. Cu ele găsim piesa exactă, potrivită pentru motorul și transmisia utilajului tău. Dacă știi codul piesei din catalog, spune-l și pe el. Dacă nu, descrie piesa sau trimite o fotografie pe WhatsApp, la 069 898 307.

      Filtrele, consumabilele și piesele de uzură sunt în stoc în Moldova. Pentru celelalte piese îți spunem la telefon dacă le avem și în cât timp le aducem.
  request:
    title: "Ce scrii în cererea de service"
    text: |
      Scrie modelul utilajului, câte moto-ore arată contorul și ce s-a întâmplat: ce ai observat, când a apărut și la ce lucrare. Adaugă un telefon la care te găsim. Cu aceste date, mecanicul știe de la început ce are de verificat.
faq:
  - q: "Unde se face service-ul utilajelor BULL?"
    a: "În service-ul propriu Ozonteh: la sediul central din Strășeni, Șos. Chișinău 69 (E58), și la filiala din Bălți, Str. Dragomir 4, telefon 069 898 310. Programul e luni–vineri 08:00–18:00 și sâmbătă 08:00–14:00. Service: 069 898 842."
  - q: "Ce garanție au utilajele BULL?"
    a: "Utilajul are garanție de 24 de luni sau 2000 de moto-ore, iar motorul are 3 ani sau 3000 de moto-ore. Este garanția producătorului, iar lucrările în garanție le fac mecanicii Ozonteh, la Strășeni și la Bălți."
  - q: "Aveți piese de schimb în stoc?"
    a: "Da: filtre, consumabile și piese de uzură, în stoc în Moldova. Pentru alte piese, sună la 069 898 822 cu modelul și seria utilajului. Îți spunem dacă piesa e pe stoc, iar dacă nu e, o comandăm."
  - q: "Faceți service și după expirarea garanției?"
    a: "Da. Service-ul post-garanție îl fac aceiași mecanici Ozonteh, la Strășeni și la Bălți: revizii, diagnoză și reparații, cu piese potrivite pentru modelul tău. Programează-te la 069 898 842."
