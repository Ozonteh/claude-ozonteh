seoTitle: "Ozonteh — официальный дистрибьютор BULL Machines | BULL Молдова"
seoDescription: "Ozonteh Impex SRL, Страшены: с 2011 года в сельхозтехнике, сегодня официальный дистрибьютор BULL Machines в Молдове, с сервисом и запчастями. Тел.: 069 898 307."
h1: "Ozonteh и BULL Machines"
lead: "Ozonteh Impex SRL — официальный дистрибьютор BULL Machines в Республике Молдова. Мы поставляем технику напрямую от производителя и обслуживаем её в Страшенах и Бельцах."
blocks:
  ozonteh:
    title: "Компания Ozonteh"
    text: |
      Ozonteh Impex SRL основана в 2011 году в Страшенах. Её создали трое молодых людей, увлечённых сельхозтехникой, и начинали они с импорта японских тракторов. Сегодня Ozonteh предлагает комплексные решения для виноградников, садов и малых и средних ферм: вы выбираете технику, мы её доставляем, а сервис и запчасти остаются у нас же.

      Мы официальный дилер более 10 брендов, среди них LS, Ferrari, Zanon, Bao Mak, Adrimak и Kadioglu. Как официальный дистрибьютор BULL Machines, мы поставляем в Молдову и строительную технику: экскаваторы-погрузчики, фронтальные и мини-погрузчики.

      У нас собственный сервис с квалифицированными механиками: в главном офисе в Страшенах (шоссе Кишинэу, 69, E58) и в филиале в Бельцах (ул. Драгомир, 4). Мы выполняем гарантийное и постгарантийное обслуживание, а фильтры, расходные материалы и быстроизнашиваемые детали держим в наличии в Молдове. В Румынии у нас есть представительство Deltateh, в Бухаресте и Клуже.

      Мы доставляем технику по всей Молдове, на базу клиента или прямо на объект. Для лизинга работаем с maib и Microinvest.
  bull:
    title: "Компания BULL Machines"
    text: |
      BULL Machines Pvt Ltd находится в Коимбатуре (Индия) и входит в группу AV. Основатель и генеральный директор компании — V. Parthiban.

      По данным BULL Machines, сегодня в мире работают более 60 000 машин BULL. У компании более 600 дилеров, более 150 сервисных инженеров на местах, более 24 лет опыта в производстве навесного оборудования для тракторов и два завода. BULL сообщает, что её завод строительной техники выпускает 12 000 машин в год, а собственное подразделение исследований и разработок, признанное Министерством науки и технологий Индии, имеет патенты.

      По данным производителя, кабины BULL сертифицированы по ROPS/FOPS и защищают оператора при опрокидывании и падении предметов. Компоненты поставляют известные производители: двигатели Kirloskar, Perkins, Kubota и Ashok Leyland, трансмиссии Carraro и ZF. Какой двигатель и какая трансмиссия стоят на каждой модели, смотрите в её технических характеристиках.
  partnership:
    title: "Что вы получаете от этого партнёрства"
    text: |
      Вы покупаете новую машину, поставленную напрямую от BULL Machines, с документами и гарантией производителя: 24 месяца или 2000 моточасов на машину, 3 года или 3000 моточасов на двигатель. Когда понадобится деталь или механик, вы не зависите от посредника из другой страны.

      Гарантию и сервис обеспечивает Ozonteh, в Страшенах и Бельцах. Фильтры, расходные материалы и быстроизнашиваемые детали есть в наличии в Молдове. Технику мы доставим на вашу базу или прямо на объект, в любую точку Молдовы. До покупки машину можно увидеть в работе на демонстрации в Страшенах. Для финансирования мы работаем с maib и Microinvest, а цену вы получите в предложении под вашу комплектацию.
  visit:
    title: "Делегация BULL Machines в Страшенах"
    text: |
      11 сентября 2026 года делегация BULL Machines посетила офис Ozonteh в Страшенах (шоссе Кишинэу, 69, E58). По этому адресу находятся главный офис Ozonteh и сервис, где обслуживают технику BULL. Видео о визите вы найдёте на YouTube-канале Ozonteh. Если вы тоже хотите увидеть технику BULL вблизи, запишитесь на демонстрацию в Страшенах: 069 898 307.
