seoTitle: "Контакты Ozonteh: Страшены, Бельцы, 069 898 307 | BULL Молдова"
seoDescription: "BULL Молдова: Страшены, шоссе Кишинэу, 69 (E58), и филиал в Бельцах, ул. Драгомир, 4. Пн–пт 08:00–18:00, сб 08:00–14:00. Звоните: 069 898 307."
h1: "Контакты BULL Молдова"
lead: "Линия BULL Молдова: 069 898 307, звонки и WhatsApp. Мы находимся в Страшенах (шоссе Кишинэу, 69, E58) и в Бельцах (ул. Драгомир, 4)."
blocks:
  visit:
    title: "Визит или демонстрация в Страшенах"
    text: |
      Хотите увидеть технику BULL в работе до покупки? Позвоните по номеру 069 898 307, напишите в WhatsApp или отметьте «Хочу демонстрацию» в форме. Назовите модель и расскажите о вашей задаче, и мы согласуем день и время. Режим работы: понедельник–пятница 08:00–18:00, суббота 08:00–14:00, воскресенье — выходной.
  romania:
    title: "Представительство в Румынии"
    text: |
      В Румынии у Ozonteh есть представительство Deltateh с адресами в Бухаресте и в жудеце Клуж. Адреса и телефоны вы найдёте в списке филиалов. По технике BULL с этого сайта прямая линия остаётся прежней: +373 69 898 307, звонки и WhatsApp.
