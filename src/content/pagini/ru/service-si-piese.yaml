seoTitle: "Сервис и запчасти для техники BULL в Молдове | BULL Молдова"
seoDescription: "Гарантийный и постгарантийный сервис BULL в Страшенах и Бельцах. Фильтры и расходники в наличии в Молдове. Запчасти: 069 898 822, сервис: 069 898 842."
h1: "Сервис и запчасти BULL"
lead: "Собственный сервис Ozonteh с квалифицированными механиками в Страшенах и Бельцах. Фильтры, расходные материалы и быстроизнашиваемые детали есть в наличии в Молдове."
blocks:
  services:
    title: "Что мы делаем для вашей машины"
    items:
      - title: "Гарантийное обслуживание"
        text: "На машину BULL действует гарантия 24 месяца или 2000 моточасов, на двигатель — 3 года или 3000 моточасов. Гарантийные работы выполняют механики Ozonteh в собственном сервисе в Страшенах и Бельцах."
      - title: "Постгарантийный сервис"
        text: "Когда гарантия закончится, вы остаётесь в том же сервисе, у тех же механиков. Они находят причину неисправности и ремонтируют двигатель, трансмиссию и гидравлику, с запчастями для вашей модели. Искать другую мастерскую не нужно."
      - title: "Запчасти"
        text: "Фильтры, расходные материалы и быстроизнашиваемые детали есть в наличии в Молдове. Недостающие запчасти мы закажем для вас. Звоните по номеру 069 898 822 и назовите модель и серийный номер машины."
      - title: "Плановое ТО"
        text: "Замена масла и фильтров, проверка гидравлики, трансмиссии и мостов с интервалами, которые рекомендует BULL. Своевременное ТО защищает от незапланированных простоев на объекте. Запись: 069 898 842."
  parts:
    title: "Заказ запчастей: 069 898 822"
    text: |
      Когда звоните по номеру 069 898 822, держите под рукой модель машины и серийный номер с заводской таблички. По ним мы найдём точную деталь, подходящую к двигателю и трансмиссии вашей машины. Если знаете номер детали по каталогу, назовите и его. Если нет, опишите деталь или пришлите фото в WhatsApp на номер 069 898 307.

      Фильтры, расходные материалы и быстроизнашиваемые детали есть в наличии в Молдове. По остальным запчастям мы по телефону скажем, есть ли они и за какой срок мы их привезём.
  request:
    title: "Что указать в заявке на сервис"
    text: |
      Укажите модель машины, сколько моточасов показывает счётчик и что случилось: что вы заметили, когда это началось и на какой работе. Добавьте телефон, по которому с вами можно связаться. С этими данными механик с самого начала знает, что проверять.
faq:
  - q: "Где обслуживают технику BULL?"
    a: "В собственном сервисе Ozonteh: в главном офисе в Страшенах (шоссе Кишинэу, 69, E58) и в филиале в Бельцах (ул. Драгомир, 4, телефон 069 898 310). Режим работы: понедельник–пятница 08:00–18:00, суббота 08:00–14:00. Сервис: 069 898 842."
  - q: "Какая гарантия на технику BULL?"
    a: "На машину — 24 месяца или 2000 моточасов, на двигатель — 3 года или 3000 моточасов. Это гарантия производителя, а гарантийные работы выполняют механики Ozonteh в Страшенах и Бельцах."
  - q: "Есть ли запчасти в наличии?"
    a: "Да: фильтры, расходные материалы и быстроизнашиваемые детали есть в наличии в Молдове. По другим запчастям звоните на 069 898 822 и назовите модель и серийный номер машины. Мы скажем, есть ли деталь, а если её нет, закажем."
  - q: "Вы обслуживаете технику после окончания гарантии?"
    a: "Да. Постгарантийный сервис выполняют те же механики Ozonteh в Страшенах и Бельцах: ТО, диагностика и ремонт, с запчастями для вашей модели. Запись: 069 898 842."
