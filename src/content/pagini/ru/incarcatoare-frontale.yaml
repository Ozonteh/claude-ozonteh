seoTitle: "Фронтальный погрузчик BULL Loader HD76 в Молдове | BULL Молдова"
seoDescription: "Фронтальный погрузчик BULL HD76: 76 л.с., грузоподъёмность 2 400 кг, три ковша 1,1–1,4 м³ для карьеров, дробилок и складов. Запросите цену: 069 898 307."
h1: "Фронтальные погрузчики BULL"
lead: "BULL Loader HD76: 76 л.с., грузоподъёмность 2 400 кг и три ковша объёмом от 1,1 до 1,4 м³. Для непрерывной погрузки в карьерах, у дробилок и на складах инертных материалов."
blocks:
  intro:
    title: "Машина, созданная для погрузки"
    text: |
      Фронтальный погрузчик не копает траншеи. Он делает одну работу: забирает материал из кучи и отправляет его в самосвал, бункер или дробилку. Для этого у BULL Loader HD76 есть двигатель Kirloskar мощностью 76 л.с. (56,7 кВт), трансмиссия Carraro, гидравлика 113 л/мин при 230 бар и грузоподъёмность 2 400 кг. Усилие отрыва ковша — 8 183 кгс, поэтому ковш легко входит в кучу камня или слежавшегося песка.

      HD76 поставляется с тремя ковшами, их выбирают по материалу и по высоте выгрузки. Crusher King объёмом 1,4 м³ выгружает на высоте 3,77 м, прямо в приёмный бункер дробилки. Heavy Duty объёмом 1,26 м³ выгружает на 2,96 м: это ковш для тяжёлых материалов. Booster объёмом 1,1 м³ поднимает точку выгрузки до 4,00 м, для самосвалов с высокими бортами и для бункеров.

      Между карьером, складом и объектом HD76 переезжает своим ходом, со скоростью до 41 км/ч. Для бетонированных площадок подойдёт 2WD, для карьера и мягкого грунта — 4WD. Эксплуатационная масса — 7 850 кг.
faq:
  - q: "Какой ковш выбрать для HD76?"
    a: "Зависит от того, куда вы выгружаете. Для загрузки дробилки — Crusher King: 1,4 м³ и высота выгрузки 3,77 м. Для тяжёлых материалов — Heavy Duty: 1,26 м³ и выгрузка на 2,96 м. Для высоких самосвалов и бункеров — Booster: 1,1 м³ и выгрузка на 4,00 м. Расскажите, что и куда вы грузите, и мы подберём ковш."
  - q: "Почему фронтальный погрузчик, а не экскаватор-погрузчик?"
    a: "Если работа — только погрузка, экскаваторная стрела вам не нужна. У HD76 ковши объёмом до 1,4 м³ и грузоподъёмность 2 400 кг, а у экскаватора-погрузчика CH76 Challenger, для сравнения, ковш 1,26 м³ и 2 200 кг. Если кроме погрузки нужно копать траншеи или котлованы, выбирайте экскаватор-погрузчик."
  - q: "Какая гарантия на HD76 и где проходит сервис?"
    a: "На HD76 действует гарантия 24 месяца или 2000 моточасов, на двигатель Kirloskar — 3 года или 3000 моточасов. Гарантийное и постгарантийное обслуживание выполняют механики Ozonteh в Страшенах и Бельцах. Фильтры и быстроизнашиваемые детали есть в наличии в Молдове: 069 898 822."
