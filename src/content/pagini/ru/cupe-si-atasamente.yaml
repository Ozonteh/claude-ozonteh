seoTitle: "Ковши и навесное для экскаваторов-погрузчиков BULL | BULL Молдова"
seoDescription: "19 ковшей и навесных орудий BULL: ковш 6 в 1, Square Cut, Booster, гидромолот, вилы, отвал. Для экскаваторов-погрузчиков и мини-погрузчиков. Тел.: 069 898 307."
h1: "Ковши и навесное оборудование BULL"
lead: "19 ковшей и навесных орудий для экскаваторов-погрузчиков, фронтальных и мини-погрузчиков. Сменили навесное, и та же машина выполняет другую работу."
blocks:
  intro:
    title: "Почему навесное оборудование важно"
    text: |
      Машина даёт силу, а навесное оборудование решает, что вы с ней сделаете. Стандартным ковшом вы грузите грунт и песок. Ковшом 6 в 1 грузите, планируете, захватываете, толкаете, копаете и выгружаете без всякой переналадки. Ковш Square Cut оставляет ровные стенки под 90° в котлованах под фундамент, и доводить их лопатой не нужно. Гидромолот разрушает бетон и асфальт, вилочный захват перевозит поддоны, а отвал планирует грунт и убирает снег. Правильно подобранное навесное — это меньше проходов и меньше ручного труда.

      Совместимость зависит от типа машины. У экскаватора-погрузчика два рабочих органа: спереди он работает с погрузочными ковшами, вилами, захватом для тюков, отвалом и ковшом с катком, сзади — с ковшами экскаватора, трапецеидальным ковшом, ковшом для очистки канав, Square Cut, гидромолотом и рыхлителем. Фронтальный погрузчик HD76 работает с передним навесным, включая захват для тростника. На мини-погрузчик устанавливаются вилочный захват и гидромолот.

      Отфильтруйте список по типу машины, чтобы видеть только подходящие орудия. Точную совместимость с вашей моделью мы проверим при заказе.
faq:
  - q: "Как узнать, подходит ли навесное к моей машине?"
    a: "У каждого орудия в списке указано, на какой тип техники оно устанавливается: экскаватор-погрузчик, фронтальный погрузчик или мини-погрузчик. Точная совместимость зависит от модели и комплектации, поэтому мы проверяем её при заказе. Позвоните по номеру 069 898 307 и назовите модель вашей машины."
  - q: "Что умеет ковш 6 в 1?"
    a: "Это челюстной ковш: им вы грузите, планируете, захватываете, толкаете, копаете и выгружаете, то есть он заменяет несколько отдельных ковшей. Устанавливается на экскаваторы-погрузчики и фронтальный погрузчик. HD 100 в версии Carraro + Casappa поставляется с ковшом 6 в 1."
  - q: "Какой ковш выбрать для котлована под фундамент?"
    a: "Ковш Square Cut. Он оставляет ровные стенки под 90° в котлованах под фундамент, в резервуарах и септиках, поэтому время на ручную доводку не уходит. Устанавливается на экскаваторную стрелу экскаватора-погрузчика. Для ирригационных и дренажных каналов есть трапецеидальный ковш: он формирует профиль за один проход."
