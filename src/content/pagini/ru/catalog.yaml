seoTitle: "Спецтехника BULL в Молдове: все 9 моделей | BULL Молдова"
seoDescription: "Экскаваторы-погрузчики, фронтальные и мини-погрузчики BULL: 9 моделей от 52 до 100 л.с., 2WD и 4WD. Доставка, сервис и запчасти в Молдове. Тел.: 069 898 307."
h1: "Строительная техника BULL"
lead: "Девять моделей BULL: от мини-погрузчика массой 3 т до экскаватора-погрузчика массой 9,7 т и мощностью 100 л.с. Фильтруйте по типу, мощности, приводу и массе."
blocks:
  intro:
    title: "Три типа техники. Выбирайте по задаче"
    text: |
      Модельный ряд BULL в Молдове включает три типа техники. Экскаватор-погрузчик копает задней стрелой и грузит передним ковшом: шесть моделей мощностью от 74,5 до 100 л.с. для траншей, фундаментов, инженерных сетей и земляных работ. У фронтального погрузчика BULL Loader HD76 нет экскаваторной стрелы, он работает там, где грузят весь день: в карьерах, у дробилок, на складах инертных материалов. Мини-погрузчики AV490 и AV740 компактные, с двигателями Kubota, для дворов, цехов, ферм и коммунальных работ.

      Начинайте с задачи. Если часто копаете, вам нужен экскаватор-погрузчик. Если только грузите, фронтальный погрузчик. Если места мало, мини-погрузчик. На мягком грунте, в грязи и на уклоне выбирайте полный привод 4WD. Для тяжёлой ежедневной работы смотрите класс 96–100 л.с. Масса показывает, насколько машина устойчива при погрузке: от 3 т у AV490 до 9,7 т у Grandia.

      Не уверены, какая модель вам подойдёт? Позвоните по номеру 069 898 307 и расскажите о вашей задаче.
