seoTitle: "Сравнение моделей BULL: характеристики рядом | BULL Молдова"
seoDescription: "Сравните до 3 моделей BULL строка за строкой: мощность, двигатель, масса, глубина копания, гидропоток и привод. Затем запросите предложение: 069 898 307."
h1: "Сравнение моделей BULL"
lead: "Поставьте рядом до трёх машин BULL и посмотрите разницу в мощности, массе, гидравлике и приводе, прежде чем запрашивать предложение."
blocks:
  howto:
    title: "Как пользоваться сравнением"
    text: |
      Выберите до трёх моделей в списках ниже или отметьте «Сравнить» на карточках в каталоге. Таблица выстраивает характеристики рядом, строка за строкой: мощность, двигатель, масса, глубина копания, скорость, гидропоток и давление. На телефоне листайте между моделями. Прочерк «—» означает, что BULL не публикует это значение; если оно вам нужно, спросите нас.
