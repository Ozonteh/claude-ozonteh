seoTitle: "Мини-погрузчики BULL AV490 и AV740 в Молдове | BULL Молдова"
seoDescription: "Мини-погрузчики BULL: AV490 массой 3 т и 52 л.с., AV740 массой 4,3 т и 74,3 л.с., двигатели Kubota. Для тесных площадок, ферм и складов. Тел.: 069 898 307."
h1: "Мини-погрузчики BULL"
lead: "Две компактные модели с двигателями Kubota и приводом 4WD: AV490 массой 3 т и AV740 массой 4,3 т. Для работ там, где большая машина не помещается."
blocks:
  intro:
    title: "Где работает мини-погрузчик"
    text: |
      Мини-погрузчик нужен там, где экскаватор-погрузчик не помещается или ему негде развернуться: во дворах, цехах, коровниках, на складах и на стройке частного дома. На фермах он грузит навоз и корма и чистит помещения. На складах перевозит поддоны на вилах. В коммунальном хозяйстве убирает улицы и площадки и подвозит грунт и щебень для благоустройства.

      AV490 — компактная модель: 3 000 кг, турбодизель Kubota мощностью 52 л.с. (39 кВт), номинальная нагрузка 655 кг и ширина по шинам 1 500 мм. Он разворачивается на месте, управляется джойстиками, у него есть сенсорный экран и камера заднего вида. Стандартный гидропоток — 57 л/мин, опционально 82 л/мин для фрез и щёток.

      AV740 крупнее и мощнее: 4 272 кг, турбодизель Kubota мощностью 74,3 л.с. (55,4 кВт) и номинальная нагрузка 1 347 кг. Стрела с вертикальным подъёмом держит постоянную нагрузку по всей высоте и выгружает на высоте 2 570 мм, прямо в кузов. Гидравлика — 102 л/мин, опционально 131 л/мин. Кабина ROPS/FOPS и автонивелирование входят в стандартную комплектацию.
faq:
  - q: "AV490 или AV740: какой выбрать?"
    a: "AV490 — если вы работаете в тесных местах и поднимаете лёгкие грузы: 3 000 кг, ширина по шинам 1 500 мм, номинальная нагрузка 655 кг. AV740 — если загружаете грузовики и перевозите тяжёлые поддоны: номинальная нагрузка 1 347 кг, высота выгрузки 2 570 мм и гидравлика 102 л/мин. Расскажите о задаче по телефону 069 898 307, и мы порекомендуем модель."
  - q: "Что даёт вертикальный подъём стрелы у AV740?"
    a: "Стрела поднимается по вертикальной траектории, а не по дуге. Груз остаётся близко к машине по всей высоте, поэтому AV740 поднимает одинаковый вес внизу и вверху и легче достаёт через борт грузовика. Высота выгрузки — 2 570 мм."
  - q: "Какое навесное оборудование подходит к мини-погрузчикам BULL?"
    a: "Кроме ковша, из ассортимента навесного оборудования BULL на мини-погрузчик устанавливаются вилочный захват и гидромолот. У AV490 есть быстросъёмное крепление навесного, а с увеличенным гидропотоком 82 л/мин он работает и с фрезами, и со щётками. Точную совместимость с вашей моделью мы проверим при заказе."
