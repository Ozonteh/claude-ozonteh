seoTitle: "Экскаваторы-погрузчики BULL в Молдове: 6 моделей | BULL Молдова"
seoDescription: "Экскаваторы-погрузчики BULL 74,5–100 л.с., 2WD и 4WD, гарантия 24 месяца или 2000 моточасов. Сервис в Страшенах и Бельцах. Запросите цену: 069 898 307."
h1: "Экскаваторы-погрузчики BULL"
lead: "Шесть моделей экскаваторов-погрузчиков мощностью от 74,5 до 100 л.с., с приводом 2WD или 4WD. Гарантия на каждую машину — 24 месяца или 2000 моточасов, на двигатель — 3 года или 3000 моточасов."
blocks:
  intro:
    title: "Какой экскаватор-погрузчик вам подойдёт"
    text: |
      Экскаватор-погрузчик совмещает две профессии. Задней стрелой вы копаете траншеи под воду, канализацию и кабели, котлованы под фундаменты, септики и дренажные каналы. Передним ковшом грузите самосвал, засыпаете траншею, планируете участок и убираете снег. Между объектами машина переезжает своим ходом, со скоростью до 40 км/ч. Её покупают строительные компании и подрядчики по сетям, дорожники, примэрии и фермы, где много земляных работ.

      В линейке BULL два класса. В классе 75 л.с. — SD76 Super Smart (75 л.с., 130 л/мин, до 40 км/ч), CH76 Challenger (76 л.с., 2WD, низкая стоимость моточаса) и Grandia DLX (74,5 л.с., 4WD, кабина с кондиционером и джойстиковое управление). Их достаточно для сетей, фундаментов частных домов и коммунальных работ. Класс 96–100 л.с. даёт запас силы для тяжёлой ежедневной работы: HD96 4WD (96 л.с., 240 бар, ковш 0,30 м³), HD 100 (100 л.с., Perkins, в версии ZF Power Shift или Carraro + Casappa) и Grandia (100 л.с., 9 700 кг).

      Привода 2WD достаточно на твёрдом грунте и на дороге. В грязи, на свежей засыпке и на уклоне берите 4WD: тянут оба моста, и колёса меньше буксуют, когда вы вдавливаете ковш в кучу. У Grandia, кроме того, управляются все 4 колеса, в трёх режимах: круговой, «краб» и 2 управляемых колеса. Вы разворачиваетесь компактнее и смещаетесь по диагонали, параллельно траншее.
faq:
  - q: "Какая мощность нужна: 75 или 100 л.с.?"
    a: "Класса 75 л.с. достаточно для сетей, фундаментов и благоустройства: это SD76 Super Smart, CH76 Challenger и Grandia DLX. Если машина каждый день работает в тяжёлом грунте, загружает много самосвалов или стоит на крупных дорожных объектах, выбирайте класс 96–100 л.с.: HD96 4WD, HD 100 или Grandia. Расскажите о задаче по телефону 069 898 307, и мы порекомендуем модель."
  - q: "2WD или 4WD: что выбрать?"
    a: "2WD — более простой вариант, его хватает на твёрдом грунте, асфальте и щебне. 4WD тянет обоими мостами и нужен в грязи, на пашне, на свежей засыпке и на уклоне. SD76 Super Smart и HD96 доступны в обоих вариантах, CH76 Challenger — только 2WD, а Grandia DLX, Grandia и HD 100 — только 4WD."
  - q: "На какую глубину копают экскаваторы-погрузчики BULL?"
    a: "SD76 Super Smart, Grandia, HD96 4WD и HD 100 копают на глубину до 4,6 м со стандартной рукоятью и до 5,6 м с телескопической. CH76 Challenger — до 4,77 м. Объём ковшей экскаватора — от 0,10 до 0,31 м³, в зависимости от модели и задачи."
  - q: "Сколько стоит экскаватор-погрузчик BULL и можно ли взять его в лизинг?"
    a: "Цену вы получите в предложении, рассчитанном под модель и комплектацию: стандартная или телескопическая рукоять, ковши и навесное оборудование. Лизинг — через maib или Microinvest. Позвоните по номеру 069 898 307 или оставьте номер в форме, и мы перезвоним."
